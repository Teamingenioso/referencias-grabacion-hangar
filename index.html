<style>
:root{--black:#0a0a0a;--raise:#131313;--yellow:#f5d400;--yellow-dim:#8f7c00;--radius:16px;--white:#fff;--dim:rgba(255,255,255,.66);--faint:rgba(255,255,255,.16);--font:'Helvetica Neue',Helvetica,Arial,sans-serif;--cols:2;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--black)}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--black);border-bottom:1px solid var(--faint);padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:2200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
h1{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
h1 span{color:var(--yellow)}
.brand{display:block;line-height:0}.brand .logo{height:22px;width:auto;display:block}
.count{color:var(--dim);font-size:14px;margin-right:auto}
.search{flex:1 1 220px;min-width:0;max-width:420px;background:var(--raise);border:1px solid var(--faint);border-radius:12px;padding:12px 15px;min-height:44px;outline:none}
.search::placeholder{color:rgba(255,255,255,.35)}
.search:focus{border-color:var(--yellow)}
.chips{flex:1 0 100%;display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;font-size:.85rem;font-weight:700;border-radius:999px;background:transparent;border:1px solid var(--faint);color:var(--dim);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--yellow);color:var(--white)}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:var(--black)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
main{max-width:2400px;margin:0 auto;padding:6px max(6px,env(safe-area-inset-right,0px)) 40px max(6px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px}
@media (min-width:640px){:root{--cols:3}}
@media (min-width:900px){:root{--cols:4}}
@media (min-width:1280px){:root{--cols:5}}
@media (min-width:1700px){:root{--cols:6}}
@media (min-width:2200px){:root{--cols:8}}
.card{position:relative;background:#000;border-radius:10px;overflow:hidden;cursor:pointer;min-width:0}
.card:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.vid{position:relative;aspect-ratio:9/16;background:#000}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}
.num{position:absolute;left:8px;top:8px;background:var(--yellow);color:#000;font-weight:700;font-size:13px;min-width:26px;height:26px;padding:0 7px;border-radius:7px;display:flex;align-items:center;justify-content:center;z-index:2}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--dim);font-size:13px;z-index:1}
.card.bad .err{display:flex}
.cap{position:absolute;left:0;right:0;bottom:0;background:#000;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;z-index:2}
.esc{font-size:12px;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:.04em}
.eti{font-size:14px;color:var(--white);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eq{position:absolute;right:8px;top:8px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.eq i{font-style:normal;background:#000;color:var(--yellow);border:1px solid var(--yellow);border-radius:999px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;white-space:nowrap}
.gearbtn .iso{height:26px;width:auto;display:block}
.gearbtn{min-height:44px;min-width:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:transparent;border:1px solid var(--faint);color:var(--white);cursor:pointer;font-weight:800;font-size:.92rem}
.gearbtn:hover,.gearbtn.on{border-color:var(--yellow);color:var(--yellow)}
.gearbtn{border:0!important;background:transparent!important;padding:0 8px}
.gearbtn.on .iso{outline:2px solid var(--yellow);outline-offset:6px;border-radius:6px}
.gear{display:none;max-width:2400px;margin:0 auto;padding:12px 16px;border-bottom:1px solid var(--faint)}
.gear.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.gear div{background:var(--raise);border:1px solid var(--faint);border-radius:var(--radius);padding:14px 16px}
.gear b{display:block;color:var(--yellow)}
.gear span{font-size:13px;color:var(--dim)}
.rng{font-size:12px;color:var(--dim)}
.empty{padding:70px 16px;text-align:center;color:var(--dim)}
.made{border-top:1px solid var(--faint);padding:46px 0 54px;text-align:center;margin-top:30px}
.made p{margin:0 0 14px;color:var(--dim);font-size:.82rem;text-transform:uppercase;letter-spacing:.14em}
.made a{display:inline-block;line-height:0}.made .logo{height:34px;width:auto;margin:0 auto;display:block}
.empty b{color:var(--white)}
.chk{position:absolute;right:8px;bottom:66px;z-index:3;width:40px;height:40px;border-radius:50%;background:#000;border:2px solid var(--faint);color:transparent;font-size:20px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chk:hover{border-color:var(--yellow)}
.card.done .chk{background:var(--yellow);border-color:var(--yellow);color:#000}
.card.done .vid video,.card.done .nov{opacity:.38}
.card.done .num{background:#fff}
.nov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;background:var(--raise);color:var(--dim);font-size:13px}
.nov b{color:var(--yellow);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.prog{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;flex:1 0 100%;margin-top:-2px}
.prog i{display:block;height:100%;width:0;background:var(--yellow);transition:width .25s}
/* detalle (estilo ficha de técnica) */
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;height:100vh;height:100dvh}
.viewer.open{display:block}
.vwrap{height:100%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.stage{position:relative;flex:none;height:58vh;height:58dvh;background:#000;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.stage.nv{height:30vh;height:30dvh}
.stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.stage.nv video,.stage.nv .pausedmark{display:none}
.noclip{display:none;color:var(--dim);text-align:center;padding:20px 72px;font-size:14px}
.stage.nv .noclip{display:block}
.vtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:3}
.vtop>*{pointer-events:auto}
.vbtn{width:48px;height:48px;border-radius:50%;background:#000;border:1px solid var(--faint);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1}
.vbtn:active{background:var(--yellow);color:#000}
.vpos{background:var(--yellow);color:#000;font-weight:700;border-radius:999px;padding:6px 12px;font-size:14px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3}
.vnav.p{left:max(10px,env(safe-area-inset-left,0px))}.vnav.n{right:max(10px,env(safe-area-inset-right,0px))}
.info{flex:none;padding:22px max(20px,env(safe-area-inset-right,0px)) max(34px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-width:760px;width:100%}
.info h2{margin:0 0 10px;font-size:clamp(1.6rem,5.6vw,2.4rem);line-height:1.05;letter-spacing:-.035em;font-weight:800;color:var(--yellow);overflow-wrap:anywhere}
.desc{margin:0 0 16px;font-size:1.05rem;color:var(--white);white-space:pre-line}
.rows{margin:0 0 18px;display:flex;flex-direction:column;gap:5px;font-size:1rem}
.rows div{display:block}
.rows dt,.rows dd{display:inline;margin:0}
.rows dt{color:var(--white)}
.rows dt:after{content:" - "}
.rows dd{color:var(--yellow)}
.rows dd a{color:var(--yellow);text-decoration:underline;text-underline-offset:3px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{min-height:34px;padding:0 16px;border-radius:999px;background:var(--yellow);color:#000;border:0;font-weight:800;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.check{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:var(--radius);background:transparent;border:2px solid var(--yellow);color:var(--yellow);font-weight:800;font-size:1.05rem;cursor:pointer}
.check[aria-pressed=true]{background:var(--yellow);color:#000}
.check .bx{width:26px;height:26px;border-radius:7px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.pausedmark{position:absolute;z-index:2;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;font-size:26px;pointer-events:none}
.stage.paused .pausedmark{display:flex}
.iabox{margin:0 0 18px;border:1px solid var(--yellow);border-radius:var(--radius);padding:14px 16px}
.iabox b{display:inline-block;background:var(--yellow);color:#000;border-radius:7px;padding:2px 8px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.iabox p{margin:10px 0 12px;white-space:pre-line}
.check.sm{min-height:46px;font-size:.95rem}
.iatag{position:absolute;left:8px;bottom:74px;z-index:3;background:var(--yellow);color:#000;font-weight:800;font-size:.66rem;letter-spacing:.08em;border-radius:7px;padding:3px 7px}
.card.iaok .iatag{background:#fff}
@media (min-width:900px){
 .vwrap{flex-direction:row;overflow:hidden}
 .stage,.stage.nv{flex:1;height:100%;min-width:0}
 .info{width:440px;max-width:440px;overflow-y:auto;padding-top:76px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
(function(){
'use strict';
var CSV='clips.csv', DIR='clips/';
var GEAR=[{o:'Ruz',k:'ZV-E10',n:'Sony ZV-E10',d:'Lente 11 mm, con estabilizador'},{o:'Juan Corzo',k:'Canon',n:'Canon',d:'Modelo y lente pendientes'},{o:'Juan Corzo',k:'Action 5',n:'DJI Action 5',d:'Cámara de acción'},{o:'Vima',k:'a6700',n:'Sony a6700 (confirmar)',d:'Con filtro ND'},{o:'Vima',k:'Osmo 360',n:'DJI Osmo 360',d:'Cámara 360'}];
var clips=[], shown=[], scene='Todas', query='', gearSel='Todos', est='Todos', done={}, store=null, dirty=false, cardsById={};
var grid=document.getElementById('grid'), chipsEl=document.getElementById('chips'), emptyEl=document.getElementById('empty'),
    countEl=document.getElementById('count'), chips2=document.getElementById('chips2'), chips3=document.getElementById('chips3'), qEl=document.getElementById('q');

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function secs(v){
  v=String(v||'').trim().replace(',','.'); if(!v) return null;
  var p=v.split(':').map(Number); if(p.some(isNaN)) return null;
  return p.reduce(function(a,b){return a*60+b},0);
}
function fmt(t){var m=Math.floor(t/60),s=Math.round((t-m*60)*10)/10;return m+':'+(s<10?'0':'')+s}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'', d=(first.split(';').length>first.split(',').length)?';':',';
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==d){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n') i++; row.push(f);f=''; rows.push(row); row=[] }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function safeUrl(u){u=String(u||'').trim(); return /^https?:\/\//i.test(u)?u:''}

/* ---- checks "ya grabado": compartido (db) con respaldo local ---- */
try{ var ls=JSON.parse(localStorage.getItem('rec_done')||'{}'); if(ls&&typeof ls==='object') done=ls }catch(e){}
function saveLocal(){ try{localStorage.setItem('rec_done',JSON.stringify(done))}catch(e){} }
function initDb(){
  if(!window.claude||!window.claude.use) return;
  window.claude.use('db').then(function(db){
    if(!db) return; store=db;
    db.collection('grabados').onSnapshot(function(s){
      var m={}; s.docs.forEach(function(d){var x=d.data(); if(x&&x.done) m[d.id]=1});
      done=m; saveLocal(); refreshDone();
    },function(){});
  }).catch(function(){});
}
function setDone(c,v){
  if(v) done[c.id]=1; else delete done[c.id];
  saveLocal(); refreshDone();
  if(store){ try{ var r=store.doc('grabados/'+c.id); (v?r.set({done:true,t:c.eti.slice(0,80)}):r.delete()).catch(function(){}) }catch(e){} }
}
function refreshDone(){
  var n=0; clips.forEach(function(c){ if(done[c.id]) n++ });
  clips.forEach(function(c){ var el=cardsById[c.id]; if(el){ var on=!!done[c.id]; el.classList.toggle('done',on); el.classList.toggle('iaok',!!done[c.id+'~ia']); var b=el.querySelector('.chk'); if(b){b.setAttribute('aria-pressed',on); b.setAttribute('aria-label',(on?'Quitar grabado: ':'Marcar grabado: ')+c.eti)} } });
  var bar=document.getElementById('progbar'); if(bar) bar.style.width=(clips.length?Math.round(n/clips.length*100):0)+'%';
  updateCount(n);
  if(viewer.classList.contains('open')) paintCheck();
  if(est!=='Todos'){ if(viewer.classList.contains('open')) dirty=true; else render() }
}
function updateCount(n){
  if(n==null){n=0; clips.forEach(function(c){ if(done[c.id]) n++ })}
  if(!clips.length){countEl.textContent='';return}
  countEl.textContent=(shown.length===clips.length?clips.length+' clips':shown.length+' de '+clips.length+' clips')+' · '+n+' grabados';
}

function load(){
  fetch(CSV,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw 0; return r.text() }).catch(function(){ var el=document.getElementById('csvfb'); if(el&&el.textContent.trim()) return el.textContent; throw 0 }).then(function(t){
    var rows=parseCSV(t); if(!rows.length) throw 0;
    var h=rows[0].map(norm), ix=function(names){for(var i=0;i<h.length;i++) if(names.indexOf(h[i])>-1) return i; return -1};
    var a=ix(['archivo','file','clip','video']), e=ix(['escena','scene','momento']), l=ix(['etiqueta','titulo','label']),
        ds=ix(['descripcion','nota','notas','que copiar','que grabar']), te=ix(['tecnica','toma','movimiento']),
        fu=ix(['fuente','link','enlace','eyecandy','url']), tg=ix(['tags','etiquetas','palabras']),
        qu=ix(['quien','dueno','graba','responsable']), ia=ix(['ia','base ia','para ia','clip ia','material ia']), ac=ix(['accion','accion del corredor','que hace','corredor','rp']),
        d=ix(['desde','from','inicio']), u=ix(['hasta','to','fin']), g=ix(['equipo','camara','camaras','gear']);
    var used={};
    clips=rows.slice(1).map(function(r,i){
      var cell=function(k){return k>-1?String(r[k]||'').trim():''};
      var f=cell(a), src=safeUrl(cell(fu)), ti=cell(l);
      if(!f&&!src&&!ti) return null;
      if(f&&!/^(https?:)?\/\//.test(f) && f.indexOf('/')<0) f=DIR+f;
      var from=d>-1?secs(r[d]):null, to=u>-1?secs(r[u]):null;
      if(from!=null&&to!=null&&to<=from){from=null;to=null}
      var base=norm(f||src||ti).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||('clip-'+(i+1)), id=base, k=2;
      while(used[id]) id=base+'-'+(k++); used[id]=1;
      return {n:i+1,id:id,img:/\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(f),src:f?encodeURI(f):'',file:f,esc:cell(e),tec:cell(te),desc:cell(ds),link:src,
        tags:cell(tg).split(/[|\/]/).map(function(x){return x.trim()}).filter(Boolean),
        quien:cell(qu), ia:cell(ia), acc:cell(ac),
        eq:cell(g).split(/[\/+]/).map(function(x){return x.trim()}).filter(Boolean),
        eti:ti||(f?f.split('/').pop().replace(/\.[a-z0-9]+$/i,''):host(src)||'Referencia '+(i+1)),from:from,to:to};
    }).filter(Boolean);
    clips.forEach(function(c,i){c.n=i+1});
    buildChips(); buildGear(); buildEst(); render(); initDb();
    if(!clips.length){countEl.textContent='';emptyEl.hidden=false;emptyEl.innerHTML='Aún no hay clips.<br>Agrega filas en <b>clips.csv</b> y sube los videos a la carpeta <b>clips</b>.'}
  }).catch(function(err){
    try{console.error(err)}catch(e){}
    countEl.textContent='';
    emptyEl.hidden=false;
    emptyEl.innerHTML='No encuentro <b>clips.csv</b> junto a esta página, o está vacío.<br>Columnas: archivo, escena, etiqueta, descripcion, tecnica, accion, equipo, fuente, tags, ia, desde, hasta.'+(err&&err.message?'<br><small>'+String(err.message).replace(/</g,'&lt;')+'</small>':'');
  });
}
function owners(c){
  var o=[]; if(c.quien) o.push(c.quien);
  c.eq.forEach(function(x){ GEAR.forEach(function(y){ if(norm(y.k)===norm(x)&&o.indexOf(y.o)<0) o.push(y.o) }) });
  return o;
}
function buildGear(){
  var used={}; clips.forEach(function(c){c.eq.forEach(function(x){used[norm(x)]=1})});
  var panel=document.getElementById('gear'); panel.innerHTML='';
  var ow=[]; GEAR.forEach(function(x){if(ow.indexOf(x.o)<0) ow.push(x.o)});
  ow.forEach(function(o){ var d=document.createElement('div'); var t=document.createElement('b'); t.textContent=o; d.appendChild(t);
    GEAR.filter(function(x){return x.o===o}).forEach(function(x){ var s=document.createElement('span'); s.style.display='block'; s.style.marginTop='6px'; s.textContent=x.n+' · '+x.d; d.appendChild(s) }); panel.appendChild(d) });
  chips2.innerHTML='';
  var keys=[]; GEAR.forEach(function(x){ if(used[norm(x.k)]&&keys.indexOf(x.o)<0) keys.push(x.o) });
  GEAR.forEach(function(x){ if(used[norm(x.k)]) keys.push(x.k) });
  clips.forEach(function(c){c.eq.forEach(function(x){ if(!GEAR.some(function(y){return norm(y.k)===norm(x)})&&keys.indexOf(x)<0) keys.push(x) })});
  if(!keys.length){chips2.style.display='none';return}
  ['Todos'].concat(keys).forEach(function(s){
    var b=document.createElement('button'); b.type='button'; b.className='chip'+(s===gearSel?' on':''); b.textContent=s==='Todos'?'Todo el equipo':s;
    b.addEventListener('click',function(){gearSel=s;[].forEach.call(chips2.children,function(x){x.classList.toggle('on',x===b)});render()});
    chips2.appendChild(b);
  });
}
function buildEst(){
  chips3.innerHTML='';
  [['Todos','Todos'],['Pendientes','Por grabar'],['Grabados','Ya grabados']].forEach(function(p){
    var b=document.createElement('button'); b.type='button'; b.className='chip'+(p[0]===est?' on':''); b.textContent=p[1];
    b.addEventListener('click',function(){est=p[0];[].forEach.call(chips3.children,function(x){x.classList.toggle('on',x===b)});render()});
    chips3.appendChild(b);
  });
}
document.getElementById('gearbtn').addEventListener('click',function(){var o=document.getElementById('gear').classList.toggle('open');this.classList.toggle('on',o);this.setAttribute('aria-expanded',o)});
function buildChips(){
  var set=[],seen={}; clips.forEach(function(c){ if(c.esc&&!seen[c.esc]){seen[c.esc]=1;set.push(c.esc)} });
  chipsEl.innerHTML='';
  if(!set.length){chipsEl.style.display='none';return}
  ['Todas'].concat(set).forEach(function(s){
    var b=document.createElement('button'); b.type='button'; b.className='chip'+(s===scene?' on':''); b.textContent=s==='Todas'?'Todos los momentos':s; b.setAttribute('role','tab');
    b.addEventListener('click',function(){scene=s;[].forEach.call(chipsEl.children,function(x){x.classList.toggle('on',x===b)});render()});
    chipsEl.appendChild(b);
  });
}
function bindRange(v,c){
  if(c.from==null||c.to==null) return;
  v.loop=false;
  var jump=function(){v.currentTime=c.from; var p=v.play(); if(p&&p.catch) p.catch(function(){})};
  v.addEventListener('loadedmetadata',function(){ if(v.currentTime<c.from) v.currentTime=c.from });
  v.addEventListener('ended',jump);
  if('requestVideoFrameCallback' in v){
    var tick=function(){ if(v.currentTime>=c.to-0.04) jump(); v.requestVideoFrameCallback(tick) };
    v.addEventListener('playing',function(){ if(!v._rvfc){v._rvfc=1; v.requestVideoFrameCallback(tick)} });
  } else v.addEventListener('timeupdate',function(){ if(v.currentTime>=c.to-0.05) jump() });
}
var near=new IntersectionObserver(function(es){es.forEach(function(en){
  var v=en.target, c=v._c;
  if(en.isIntersecting){ if(!v.getAttribute('src')){v.src=c.src; v.load()} var p=v.play(); if(p&&p.catch) p.catch(function(){}) }
  else v.pause();
})},{rootMargin:'300px 0px'});
var far=new IntersectionObserver(function(es){es.forEach(function(en){
  var v=en.target; if(!en.isIntersecting&&v.getAttribute('src')){v.pause();v.removeAttribute('src');v.load()}
})},{rootMargin:'2500px 0px'});

function render(){
  var q=norm(query);
  shown=clips.filter(function(c){
    return (scene==='Todas'||c.esc===scene)
      &&(est==='Todos'||(est==='Pendientes'?!done[c.id]:!!done[c.id]))
      &&(gearSel==='Todos'||c.eq.some(function(x){return norm(x)===norm(gearSel)||GEAR.some(function(y){return y.o===gearSel&&norm(y.k)===norm(x)})})||(c.quien&&norm(c.quien)===norm(gearSel)))
      &&(!q||norm([c.esc,c.eti,c.desc,c.tec,c.file,c.eq.join(' '),c.tags.join(' '),c.acc,(c.ia?'ia':''),owners(c).join(' ')].join(' ')).indexOf(q)>-1) });
  [].forEach.call(grid.querySelectorAll('video'),function(v){near.unobserve(v);far.unobserve(v)});
  grid.innerHTML=''; cardsById={};
  if(clips.length){emptyEl.hidden=shown.length>0; if(!shown.length) emptyEl.textContent=est==='Pendientes'&&!query&&scene==='Todas'&&gearSel==='Todos'?'Todo grabado.':'Nada coincide con tu búsqueda.'}
  var frag=document.createDocumentFragment();
  shown.forEach(function(c,i){
    var card=document.createElement('div'); card.className='card'+(done[c.id]?' done':''); card.tabIndex=0; card.setAttribute('role','button'); card.setAttribute('aria-label','Abrir ficha '+c.n+': '+c.eti);
    var vid=document.createElement('div'); vid.className='vid'; var v=null;
    if(c.src&&c.img){
      var im=document.createElement('img'); im.src=c.src; im.alt=''; im.loading='lazy'; im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover'; vid.appendChild(im);
    } else if(c.src){
      v=document.createElement('video'); v.muted=true; v.defaultMuted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.preload='none'; v._c=c;
      v.addEventListener('error',function(){ if(v.getAttribute('src')) card.classList.add('bad') });
      bindRange(v,c); vid.appendChild(v);
      var er=document.createElement('span'); er.className='err'; er.textContent='No carga: revisa el nombre del archivo ('+c.file+')'; vid.appendChild(er);
    } else {
      var nv=document.createElement('div'); nv.className='nov'; var b1=document.createElement('b'); b1.textContent=c.tec||c.eti; var s1=document.createElement('span'); s1.textContent=/eyecan+dy/i.test(host(c.link))?'Eyecandy':'Referencia por enlace'; nv.appendChild(b1); nv.appendChild(s1); vid.appendChild(nv);
    }
    var n=document.createElement('span'); n.className='num'; n.textContent=c.n; vid.appendChild(n);
    if(c.eq.length){var eq=document.createElement('span'); eq.className='eq'; c.eq.forEach(function(x){var i2=document.createElement('i'); i2.textContent=x; eq.appendChild(i2)}); vid.appendChild(eq)}
    var chk=document.createElement('button'); chk.type='button'; chk.className='chk'; chk.textContent='✓'; chk.setAttribute('aria-pressed',!!done[c.id]); chk.setAttribute('aria-label',(done[c.id]?'Quitar grabado: ':'Marcar grabado: ')+c.eti);
    chk.addEventListener('click',function(ev){ev.stopPropagation(); setDone(c,!done[c.id])});
    chk.addEventListener('keydown',function(ev){ev.stopPropagation()});
    vid.appendChild(chk);
    if(c.ia){var it=document.createElement('span'); it.className='iatag'; it.textContent='BASE IA'; vid.appendChild(it); if(done[c.id+'~ia']) card.classList.add('iaok')}
    var cap=document.createElement('div'); cap.className='cap';
    if(c.esc){var s=document.createElement('span'); s.className='esc'; s.textContent=c.esc; cap.appendChild(s)}
    var t=document.createElement('span'); t.className='eti'; t.textContent=c.eti; cap.appendChild(t);
    if(c.from!=null){var r=document.createElement('span'); r.className='rng'; r.textContent='Tramo '+fmt(c.from)+' a '+fmt(c.to); cap.appendChild(r)}
    card.appendChild(vid); card.appendChild(cap);
    var open=function(){openViewer(i)};
    card.addEventListener('click',open);
    card.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()} });
    frag.appendChild(card); cardsById[c.id]=card;
    if(v){near.observe(v); far.observe(v)}
  });
  grid.appendChild(frag);
  var n2=0; clips.forEach(function(c){ if(done[c.id]) n2++ });
  var bar=document.getElementById('progbar'); if(bar) bar.style.width=(clips.length?Math.round(n2/clips.length*100):0)+'%';
  updateCount(n2);
}
qEl.addEventListener('input',function(){query=qEl.value;render()});

/* ficha a pantalla completa */
var viewer=document.getElementById('viewer'), stage=document.getElementById('stage'), vv=document.getElementById('vv'), vwrap=document.getElementById('vwrap'),
    vpos=document.getElementById('vpos'), cur=0, wl=null, rangeHandler=null;
function row(dl,label,node){
  var d=document.createElement('div'), dt=document.createElement('dt'), dd=document.createElement('dd');
  dt.textContent=label; if(typeof node==='string') dd.textContent=node; else dd.appendChild(node);
  d.appendChild(dt); d.appendChild(dd); dl.appendChild(d);
}
function paintCheck(){
  var c=shown[cur]; if(!c) return; var on=!!done[c.id], b=document.getElementById('vcheck');
  b.setAttribute('aria-pressed',on); b.querySelector('.bx').textContent=on?'✓':''; document.getElementById('vchecktxt').textContent=on?'Ya grabado':'Marcar como grabado';
  var ob=!!done[c.id+'~ia'], ab=document.getElementById('viacheck'); ab.setAttribute('aria-pressed',ob); ab.querySelector('.bx').textContent=ob?'✓':''; document.getElementById('viachecktxt').textContent=ob?'Clip base grabado':'Marcar clip base grabado';
}
function showViewer(i){
  if(!shown.length) return;
  cur=(i+shown.length)%shown.length; var c=shown[cur];
  vv.pause(); if(rangeHandler){vv.removeEventListener('timeupdate',rangeHandler);vv.removeEventListener('ended',rangeHandler);rangeHandler=null}
  stage.classList.toggle('nv',!c.src);
  var vi=document.getElementById('vimg'); if(!vi){vi=document.createElement('img'); vi.id='vimg'; vi.alt=''; vi.style.cssText='width:100%;height:100%;object-fit:contain;display:none'; stage.insertBefore(vi,vv)}
  vi.style.display=c.img?'block':'none'; vv.style.display=c.img?'none':''; if(c.img) vi.src=c.src;
  if(c.src&&!c.img){
    vv.loop=true; vv.src=c.src; vv.load();
    if(c.from!=null){
      vv.loop=false;
      rangeHandler=function(){ if(vv.ended||vv.currentTime>=c.to-0.05){vv.currentTime=c.from; var p=vv.play(); if(p&&p.catch)p.catch(function(){})} };
      vv.addEventListener('timeupdate',rangeHandler); vv.addEventListener('ended',rangeHandler);
      vv.addEventListener('loadedmetadata',function f(){vv.removeEventListener('loadedmetadata',f); vv.currentTime=c.from},{once:true});
    }
    var p=vv.play(); if(p&&p.catch)p.catch(function(){});
  } else { vv.removeAttribute('src'); vv.load() }
  stage.classList.remove('paused');
  vpos.textContent=c.n+' / '+clips.length;
  document.getElementById('vti').textContent=c.eti;
  var de=document.getElementById('vdesc'); de.textContent=c.desc; de.style.display=c.desc?'':'none';
  var dl=document.getElementById('vrows'); dl.innerHTML='';
  if(c.esc) row(dl,'Momento de la carrera',c.esc);
  if(c.tec) row(dl,'Técnica',c.tec);
  if(c.acc) row(dl,'Acción del corredor',c.acc);
  if(c.eq.length) row(dl,'Equipo',c.eq.join(' / '));
  var ow=owners(c); if(ow.length) row(dl,'Quién graba',ow.join(' / '));
  if(c.from!=null) row(dl,'Tramo del clip',fmt(c.from)+' a '+fmt(c.to));
  if(c.link){ var a=document.createElement('a'); a.href=c.link; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=/eyecan+dy/i.test(host(c.link))?'Ver en Eyecandy':'Enlace ('+host(c.link)+')'; row(dl,'Fuente original',a) }
  var tg=document.getElementById('vtags'); tg.innerHTML=''; tg.style.display=c.tags.length?'':'none';
  c.tags.forEach(function(x){ var b=document.createElement('button'); b.type='button'; b.className='pill'; b.textContent=x;
    b.addEventListener('click',function(){ query=x; qEl.value=x; closeViewer(); render() }); tg.appendChild(b) });
  var ib=document.getElementById('viabox'); ib.style.display=c.ia?'':'none'; document.getElementById('viatxt').textContent=c.ia;
  paintCheck(); vwrap.scrollTop=0;
}
function openViewer(i){
  viewer.classList.add('open'); document.body.classList.add('lock'); showViewer(i);
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){}) }catch(e){}
  try{ history.pushState({v:1},'') }catch(e){}
}
function closeViewer(fromPop){
  if(!viewer.classList.contains('open')) return;
  viewer.classList.remove('open'); document.body.classList.remove('lock'); vv.pause(); vv.removeAttribute('src'); vv.load();
  try{ if(wl){wl.release();wl=null} }catch(e){}
  if(!fromPop){ try{ if(history.state&&history.state.v) history.back() }catch(e){} }
  if(dirty){dirty=false; render()}
}
window.addEventListener('popstate',function(){closeViewer(true)});
document.getElementById('vclose').addEventListener('click',function(){closeViewer()});
document.getElementById('vprev').addEventListener('click',function(ev){ev.stopPropagation();showViewer(cur-1)});
document.getElementById('vnext').addEventListener('click',function(ev){ev.stopPropagation();showViewer(cur+1)});
document.getElementById('viacheck').addEventListener('click',function(){ var c=shown[cur]; if(c) setDone({id:c.id+'~ia',eti:'Base IA: '+c.eti},!done[c.id+'~ia']) });
document.getElementById('vcheck').addEventListener('click',function(){ var c=shown[cur]; if(c) setDone(c,!done[c.id]) });
vv.addEventListener('click',function(){ if(vv.paused){vv.play();stage.classList.remove('paused')} else {vv.pause();stage.classList.add('paused')} });
document.addEventListener('keydown',function(ev){
  if(!viewer.classList.contains('open')) return;
  if(ev.key==='Escape') closeViewer(); else if(ev.key==='ArrowLeft') showViewer(cur-1); else if(ev.key==='ArrowRight') showViewer(cur+1);
});
var tx=null,ty=null;
stage.addEventListener('touchstart',function(ev){tx=ev.touches[0].clientX;ty=ev.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',function(ev){
  if(tx==null) return; var dx=ev.changedTouches[0].clientX-tx, dy=ev.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ ev.preventDefault(); showViewer(cur+(dx<0?1:-1)) }
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&viewer.classList.contains('open')&&!stage.classList.contains('paused')){ try{ navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){}) }catch(e){} } });
load();
})();

</script>
</body></html>
