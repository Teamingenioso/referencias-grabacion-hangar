  header .panel{padding:0;margin:0;min-height:0;height:0;border:0;background:none;box-shadow:none}
  header .panel h1{display:none}
  header .panel .tabs{position:fixed;left:0;right:0;top:0;bottom:auto;width:100%;max-width:none;margin:0;padding:10px 24px 12px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:stretch;column-gap:8px;background:rgba(17,17,17,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:0;border-bottom:1px solid rgba(255,255,255,.14);border-radius:0 0 28px 28px;box-shadow:0 12px 34px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);overflow:visible;z-index:60}
  header .panel .tabs button svg{display:none!important}
  header .panel .tabs button[data-t],header .panel .tabs button[data-t].on,header .panel .tabs button[data-t]:first-child{position:relative;z-index:1;flex:1 1 auto;min-height:46px;margin:0;padding:0 24px;border:0;border-radius:22px;background:transparent;color:rgba(255,255,255,.66);font-weight:800;font-size:.92rem;white-space:nowrap;box-shadow:none;filter:none;transition:color .2s}
  header .panel .tabs button[data-t]:hover{color:#fff;filter:none}
  header .panel .tabs button[data-t].on{color:#000}
  header .panel .tabs button.on::before,header .panel .tabs button.on::after{content:none!important}
  header .panel .tabs::before{content:'';position:absolute;left:0;top:0;width:var(--iw,0);height:var(--ih,0);transform:translate(var(--ix,0),var(--iy,0));border-radius:22px;background:var(--yel);box-shadow:0 0 18px rgba(245,212,0,.55),0 0 4px rgba(245,212,0,.6);transition:transform .55s cubic-bezier(.34,1.45,.5,1),width .55s cubic-bezier(.34,1.45,.5,1),height .3s;z-index:0;pointer-events:none}
  header .panel .tabs.liq::before{animation:liqsq .55s ease-in-out}
  header .panel .tabs .finbtn{display:flex!important;position:relative;z-index:1;flex:1 1 auto;margin:0!important;min-height:46px;padding:0 22px;border-radius:22px;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;white-space:nowrap;background:transparent;border:0;color:rgba(255,255,255,.38);opacity:1;box-shadow:none}
  header .panel .tabs .finbtn:not(:disabled){background:#22c55e;color:#04210f;box-shadow:0 0 16px rgba(34,197,94,.5),0 0 2px rgba(34,197,94,.8)}
  header .panel .tabs .gearbtn{position:relative;z-index:1;display:flex;flex:0 0 52px;margin:0!important;min-height:46px;padding:0!important;align-items:center;justify-content:center;border-radius:22px;background:transparent;border:0}
  header .panel .tabs .gearbtn svg{display:block!important;width:18px;height:auto;max-height:30px}
  .mbbar,.tab-exp .mbbar{border-radius:22px}
  .tab-exp .mbbar{display:none}
  header .panel .tabs button:nth-child(1),header .panel .tabs button:nth-child(2),header .panel .tabs button:nth-child(4){grid-column:span 2}
  header .panel .tabs button:nth-child(3){grid-column:span 3}
  header .panel .tabs .finbtn{grid-column:span 2}
  header .panel .tabs .gearbtn{grid-column:span 1}
  header .panel .tabs button[data-t],header .panel .tabs button[data-t].on,header .panel .tabs button[data-t]:first-child{padding:0 8px;display:flex;align-items:center;justify-content:center;text-align:center}
  header .panel .tabs .finbtn{padding:0 8px}
  header .panel .tabs .gearbtn{flex:none;width:auto}
  /* grid de 12 columnas para todo el contenido */
  main,.exgrid,.exgrid.vert,.qpane,.subtabs{max-width:none}
  main{padding-left:24px;padding-right:24px}
  .dia{padding-left:0!important;padding-right:0!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;column-gap:12px}
  .dstep{grid-column:span 4}
  .grid,.grid.land{column-gap:12px}
  .grid,.grid.land{--cols:3}
  .card{margin-bottom:12px}
  .exgrid,.exgrid.vert{column-gap:12px;padding-left:0;padding-right:0}
  body{padding-top:88px;padding-bottom:0}
}
@media (min-width:1280px){ .grid,.grid.land{--cols:4} .exgrid,.exgrid.vert{column-count:4} }
@media (min-width:1700px){ .grid,.grid.land{--cols:6} .exgrid,.exgrid.vert{column-count:6} }
@media (min-width:900px) and (max-width:1279px){ .exgrid,.exgrid.vert{column-count:3} }

/* subpestañas de Reels */
.subtabs{display:flex;gap:8px;padding:12px 12px 4px;max-width:2000px;margin:0 auto}
.subtabs button{min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--faint);background:transparent;color:var(--dim);font-weight:800;font-size:.9rem;cursor:pointer}
.subtabs button.on{background:var(--yellow);border-color:var(--yellow);color:#000;box-shadow:0 0 16px rgba(245,212,0,.42),0 0 2px rgba(245,212,0,.8)}
.qpane{max-width:900px;margin:0 auto;padding:0 0 28px}
.qlist{list-style:none;margin:6px 16px 0;padding:0;counter-reset:q;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.qlist li{counter-increment:q;display:flex;gap:10px;align-items:flex-start;background:var(--raise);border:1px solid var(--faint);border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.3}
.qlist li:before{content:counter(q);flex:none;min-width:24px;height:24px;border-radius:7px;background:var(--yellow);color:#000;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.trpane[hidden],.qpane[hidden]{display:none}

/* etiquetas y pie flotantes: ya no tapan el clip */
.card{background:transparent;overflow:visible}
.card .vid{border-radius:12px 12px 0 0;overflow:hidden;background:#000}
.card .cap{position:relative;left:auto;right:auto;bottom:auto;margin:0;border-radius:0 0 14px 14px;background:#000;border:1px solid rgba(255,255,255,.12);border-top:0;box-shadow:0 8px 20px rgba(0,0,0,.45);padding:9px 11px 10px;z-index:4}
.card .chk,.card .tom{bottom:8px}
.card .cap{box-shadow:none}
.ctags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.ctags .eq{position:static;display:contents}
.ctags .eq i{font-size:.6rem;padding:3px 8px}
.ctags .iatag{position:static;font-size:.6rem}

/* etiquetas optimizadas: una sola línea, máx. 3 + contador */
.ctags{flex-wrap:wrap;gap:4px 5px}
.ctags .ch{font-style:normal;flex:none;white-space:nowrap;border-radius:999px;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;line-height:1.2}
.ctags .ch.ia{background:var(--yellow);color:#000}
.ctags .ch.ce{border:1px solid var(--yellow);color:var(--yellow)}
.ctags .ch.tg{border:1px solid rgba(255,255,255,.4);color:#fff}
.ctags .ch.mo{background:rgba(255,255,255,.14);color:#fff;padding:3px 7px}
.card.iaok .ctags .ch.ia{background:#fff}
@media (min-width:900px){
  header .panel .tabs{left:16px;right:16px;top:12px;width:auto;border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:8px 14px}
  body{padding-top:92px}
}

/* tomas y check dentro del pie, ya no tapan el clip */
.card .cap{min-height:50px;padding-right:12px}
.card .cap .esc{padding-right:96px;min-height:30px;display:flex;align-items:center}
.card .cap .chk,.card .cap .tom{position:absolute;right:10px;top:10px;bottom:auto;z-index:5}
.card .cap .chk{width:34px;height:34px;font-size:17px}
.card .cap .tom{min-height:30px;padding:0 12px;font-size:.76rem;border-width:1px}

/* tomas y check en beige */
.card .cap .tom{background:#ece2cc;border-color:#ece2cc;color:#16120a}
.card .cap .tom:before{background:#cdbd96}
.card .cap .tom.full{background:var(--yellow);border-color:var(--yellow);color:#000}
.card .cap .chk{background:#ece2cc;border-color:#ece2cc;color:transparent}
.card .cap .chk:hover{border-color:#fff}
.card.done .cap .chk{background:var(--yellow);border-color:var(--yellow);color:#000}
</style>
</head>

document.getElementById('vprev').addEventListener('click',function(ev){ev.stopPropagation();showViewer(cur-1)});
document.getElementById('vnext').addEventListener('click',function(ev){ev.stopPropagation();showViewer(cur+1)});
document.getElementById('viacheck').addEventListener('click',function(){ var c=shown[cur]; if(c) setDone({id:c.id+'~ia',eti:'Base IA: '+c.eti},!done[c.id+'~ia']) });
document.getElementById('vcheck').addEventListener('click',function(){ var c=shown[cur]; if(c) setDone(c,!done[c.id]) });
vv.addEventListener('loadedmetadata',function(){ if(vv.videoWidth) stage.style.setProperty('--ar',vv.videoWidth/vv.videoHeight) });
viewer.addEventListener('click',function(ev){ if(ev.target===viewer) closeViewer() });
vv.addEventListener('click',function(){ if(vv.paused){vv.play();stage.classList.remove('paused')} else {vv.pause();stage.classList.add('paused')} });
document.addEventListener('keydown',function(ev){
  if(!viewer.classList.contains('open')) return;
  if(ev.key==='Escape') closeViewer(); else if(ev.key==='ArrowLeft') showViewer(cur-1); else if(ev.key==='ArrowRight') showViewer(cur+1);
});
var tx=null,ty=null;
stage.addEventListener('touchstart',function(ev){tx=ev.touches[0].clientX;ty=ev.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',function(ev){
  if(tx==null) return; var dx=ev.changedTouches[0].clientX-tx, dy=ev.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ ev.preventDefault(); showViewer(cur+(dx<0?1:-1)) }
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&viewer.classList.contains('open')&&!stage.classList.contains('paused')){ try{ navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){}) }catch(e){} } });
load();
})();


(function(){ var tools=document.querySelector('.tools'), sb=document.getElementById('sbtn'), qi=document.getElementById('q');
  function paint(){ var o=tools.classList.contains('sopen'); sb.classList.toggle('on',o); sb.classList.toggle('has',!o&&!!qi.value); sb.setAttribute('aria-expanded',String(o)) }
  sb.addEventListener('click',function(){ tools.classList.toggle('sopen'); paint(); if(tools.classList.contains('sopen')) qi.focus() });
  qi.addEventListener('keydown',function(e){ if(e.key==='Escape'){ tools.classList.remove('sopen'); paint() } });
  qi.addEventListener('blur',function(){ if(!qi.value){ tools.classList.remove('sopen'); paint() } else paint() });
})();

/* ---- Pestañas y galerías (Explora, Carruseles, Reels) ---- */
(function(){
  var GAL=[
    {k:'exp',col:'explora',name:'Explora',desc:'Videos completos de cómo quedan los mejores resultados.',accept:'video/*,image/*',multi:false,add:'Agregar video',empty:'Aún no hay videos aquí.'},
    {k:'car',col:'carruseles',name:'Carruseles',desc:'Carruseles de referencia. Desliza para ver cada lámina.',accept:'image/*',multi:true,add:'Agregar carrusel',empty:'Aún no hay carruseles aquí.'},
    {k:'reel',col:'reels',name:'Reels',desc:'Reels de referencia para replicar.',accept:'video/*',multi:false,add:'Agregar reel',empty:'Aún no hay reels aquí.',vertical:true},
    {k:'ent',col:'entrevistas',name:'Videos de entrevistas',desc:'Ejemplos de entrevistas para replicar.',accept:'video/*',multi:false,add:'Agregar video',empty:'Aún no hay videos aquí.',vertical:true}
  ];
  var tabsEl=document.getElementById('tabs'), mood=document.getElementById('mood'), host=document.getElementById('gals'), st=null, api=null, panes={};
  function safe(u){ return /^(https:\/\/|\/_blob\/)/.test(u||'')?u:'' }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e }
  function norm(d){ if(Array.isArray(d.items)&&d.items.length) return d.items; return d.url?[{url:d.url,kind:d.kind||'video'}]:[] }
  GAL.forEach(function(g){
    var m=el('main','gal'); m.id='t-'+g.k; m.hidden=true;
    m.innerHTML='<div class="exhead"><div><h2></h2><p></p></div><button class="fb1 exadd" type="button" hidden></button></div>'
      +'<form class="exform" hidden><input class="finput" type="text" name="title" placeholder="Título" required maxlength="120"><textarea class="finput" name="note" rows="2" placeholder="Qué se ve o qué logra (opcional)" maxlength="400"></textarea>'
      +'<label class="flab">Archivo'+(g.multi?'s (varias láminas, hasta 20 MB cada una)':' (hasta 20 MB)')+'</label><input class="finput" type="file" name="file" accept="'+g.accept+'"'+(g.multi?' multiple':'')+'>'
      +'<label class="flab">…o pega un enlace</label><input class="finput" type="url" name="link" placeholder="https://">'
      +'<div class="fact"><button class="fb2" type="button" data-a="cancel">Cancelar</button><button class="fb1" type="submit">Guardar</button></div><p class="fmsg" role="status"></p></form>'
      +'<div class="exgrid'+(g.vertical?' vert':'')+'"></div><div class="empty" hidden></div>';
    m.querySelector('h2').textContent=g.name; m.querySelector('.exhead p').textContent=g.desc; m.querySelector('.exadd').textContent=g.add; m.querySelector('.empty').textContent=g.empty;
    host.appendChild(m); g.main=m; g.items=[]; panes[g.k]=g;
    var form=m.querySelector('form'), msg=m.querySelector('.fmsg'), addb=m.querySelector('.exadd');
    addb.addEventListener('click',function(){ form.hidden=false; form.title.focus() });
    form.querySelector('[data-a=cancel]').addEventListener('click',function(){ form.hidden=true; form.reset(); msg.textContent='' });
    form.addEventListener('submit',function(ev){ ev.preventDefault();
      var title=form.title.value.trim(), note=form.note.value.trim(), files=[].slice.call(form.file.files), link=form.link.value.trim();
      if(!files.length&&!/^https:\/\//.test(link)){ msg.textContent='Elige un archivo o pega un enlace que empiece con https://'; return }
      var btn=form.querySelector('[type=submit]'); btn.disabled=true; msg.textContent=files.length?'Subiendo…':'Guardando…';
      var items=[], p=Promise.resolve();
      files.forEach(function(f,i){ p=p.then(function(){ msg.textContent='Subiendo '+(i+1)+' de '+files.length+'…'; return api.upload(f) }).then(function(r){ items.push({url:'/_blob/'+r.id,kind:/^image\//.test(f.type)?'image':'video'}) }) });
      p.then(function(){ if(!files.length) items.push({url:link,kind:'link'}); return st.doc(g.col+'/e'+Date.now()).set({title:title,note:note,items:items,t:Date.now()}) })
       .then(function(){ form.reset(); form.hidden=true; msg.textContent='' }).catch(function(e){ msg.textContent='No se pudo guardar'+(e&&e.message?': '+e.message:'.') }).then(function(){ btn.disabled=false });
    });
  });
  function paint(g){
    var grid=g.main.querySelector('.exgrid'); grid.innerHTML=''; g.main.querySelector('.empty').hidden=g.items.length>0;
    g.main.querySelector('.exadd').hidden=!(api&&st);
    g.items.forEach(function(it){
      var list=norm(it).filter(function(x){return safe(x.url)}); if(!list.length) return;
      var c=el('article','exc'), media;
      if(list[0].kind==='link'){ media=el('a','lk','Ver completo'); media.href=list[0].url; media.target='_blank'; media.rel='noopener noreferrer' }
      else if(list.length>1||g.k==='car'){
        media=el('div','slides'); list.forEach(function(x){ var im=el('img'); im.src=x.url; im.alt=it.title||''; im.loading='lazy'; media.appendChild(im) });
        var cn=el('span','cnt',('1 / '+list.length)); var wrap=el('div','swrap'); wrap.appendChild(media); if(list.length>1) wrap.appendChild(cn);
        media.addEventListener('scroll',function(){ cn.textContent=(Math.round(media.scrollLeft/media.clientWidth)+1)+' / '+list.length });
        media=wrap;
      } else if(list[0].kind==='image'){ media=el('img'); media.src=list[0].url; media.alt=it.title||'' }
      else { media=el('video'); media.src=list[0].url; media.controls=true; media.playsInline=true; media.setAttribute('playsinline',''); media.preload='metadata' }
      c.appendChild(media);
      var d=el('div','ct'); d.appendChild(el('h3',null,it.title||'Sin título')); if(it.note) d.appendChild(el('p',null,it.note));
      if(api&&st){ var r=el('button','rm','Quitar'); r.type='button'; r.addEventListener('click',function(){ if(!r._a){ r._a=1; r.textContent='¿Seguro? Toca otra vez'; setTimeout(function(){ r._a=0; r.textContent='Quitar' },3500); return } st.doc(g.col+'/'+it.id).delete().catch(function(){}) }); d.appendChild(r) }
      c.appendChild(d); grid.appendChild(c) });
  }
  function ui(){ GAL.forEach(paint) }
  function setTab(t){ mood.hidden=t!=='mood'; GAL.forEach(function(g){ g.main.hidden=(g.k==='ent')?(t!=='reel'):(g.k!==t) }); document.body.classList.toggle('tab-exp',t!=='mood');
    [].forEach.call(tabsEl.querySelectorAll('button[data-t]'),function(b){ var on=b.getAttribute('data-t')===t; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)) });
    var pt=document.getElementById('ptitle'); if(pt){ var bb=tabsEl.querySelector('[data-t="'+t+'"]'); if(bb) pt.textContent=bb.getAttribute('aria-label') }
    try{localStorage.setItem('rec_tab',t)}catch(x){} window.scrollTo(0,0); posInd(true) }
  window.posInd=posInd; function posInd(anim){ var on=tabsEl.querySelector('button[data-t].on'); if(!on) return; tabsEl.style.setProperty('--ix',on.offsetLeft+'px'); tabsEl.style.setProperty('--iw',on.offsetWidth+'px'); tabsEl.style.setProperty('--ih',on.offsetHeight+'px'); tabsEl.style.setProperty('--iy',on.offsetTop+'px');
    if(anim){ tabsEl.classList.remove('liq'); void tabsEl.offsetWidth; tabsEl.classList.add('liq'); clearTimeout(posInd._t); posInd._t=setTimeout(function(){ tabsEl.classList.remove('liq') },650) } }
  window.addEventListener('resize',function(){ posInd(false) }); setTimeout(function(){ posInd(false) },60); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ posInd(false) });
  tabsEl.addEventListener('click',function(ev){ var b=ev.target.closest('button[data-t]'); if(b) setTab(b.getAttribute('data-t')) });
  var t0='mood'; try{ var sv=localStorage.getItem('rec_tab'); if(sv&&(sv==='mood'||panes[sv])) t0=sv }catch(x){} setTab(t0); ui();
  if(window.claude&&window.claude.use){
    window.claude.use('assets').then(function(a){ api=a; ui() }).catch(function(){});
    window.claude.use('db').then(function(db){ if(!db) return; st=db;
      GAL.forEach(function(g){ db.collection(g.col).onSnapshot(function(sn){ g.items=sn.docs.map(function(d){ var x=d.data()||{}; x.id=d.id; return x }).filter(function(x){return norm(x).length}).sort(function(a,b){return (a.t||0)-(b.t||0)}); paint(g) },function(){}) }); ui() }).catch(function(){});
  }
})();

(function(){ var mq=window.matchMedia('(max-width:899px)'), panel=document.querySelector('.panel'), tools=document.querySelector('.tools'), seg=document.getElementById('seg'), g=document.getElementById('gearbtn'), f=document.getElementById('finbtn');
  var tb=document.getElementById('tabs'); function place(){ if(mq.matches){ tools.insertBefore(f,seg); seg.insertAdjacentElement('afterend',g) } else { tb.appendChild(f); tb.appendChild(g) } if(window.posInd) window.posInd(false) }
  place(); if(mq.addEventListener) mq.addEventListener('change',place); else if(mq.addListener) mq.addListener(place);
})();

/* ---- Reels: subpestañas Entrevistas / Trends ---- */
(function(){
  var m=document.getElementById('t-reel'); if(!m) return;
  var Q=['¿Cómo te llamas y cuántos años tienes?','¿Cómo te sentiste al cruzar la meta?','¿Era tu primera vez en una carrera de 10K?','¿Cuánto tiempo llevas entrenando en el gym?','¿Qué te motivó a venir hoy?','¿Cómo te preparaste esta semana?','¿Qué fue lo más difícil de hoy?','¿En qué momento quisiste parar?','¿Qué canción te acompañó?','¿Con quién viniste?','¿Cuál es tu rutina favorita en el gym?','¿Qué es lo mejor de entrenar en Hangar?','¿Qué desayunaste hoy?','¿Qué es lo primero que vas a comer?','¿Cómo describirías el ambiente en una palabra?','¿Qué le dirías a alguien que nunca ha corrido?','¿Qué meta tienes para este año?','¿Te gustaría otra carrera así?','¿Qué te gustaría ver en el próximo evento?','¿Qué te llevas de hoy?'];
  var bar=document.createElement('div'); bar.className='subtabs'; bar.setAttribute('role','tablist');
  var pane=document.createElement('section'); pane.className='qpane';
  var h=document.createElement('div'); h.className='exhead'; h.innerHTML='<div><h2>Entrevistas</h2><p>20 preguntas cortas para platicar con los corredores. No todo es la carrera: cómo la pasaron, su experiencia y si quieren más.</p></div>';
  var ol=document.createElement('ol'); ol.className='qlist'; Q.forEach(function(q){ var li=document.createElement('li'); li.textContent=q; ol.appendChild(li) });
  pane.appendChild(h); var ge=document.getElementById('t-ent'); if(ge){ ge.hidden=false; pane.appendChild(ge) } var qh=document.createElement('div'); qh.className='exhead'; qh.innerHTML='<div><h2>Preguntas</h2></div>'; pane.appendChild(qh); pane.appendChild(ol);
  var parts=[].slice.call(m.children); var trend=document.createElement('div'); trend.className='trpane'; parts.forEach(function(c){ trend.appendChild(c) });
  var hh=trend.querySelector('.exhead h2'); if(hh) hh.textContent='Trends'; var hp=trend.querySelector('.exhead p'); if(hp) hp.textContent='Trends y reels de referencia para replicar.';
  m.appendChild(bar); m.appendChild(pane); m.appendChild(trend);
  var cur='ent';
  [['ent','Entrevistas'],['tr','Trends']].forEach(function(x){ var b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.dataset.s=x[0]; b.textContent=x[1]; b.addEventListener('click',function(){ cur=x[0]; sync() }); bar.appendChild(b) });
  function sync(){ pane.hidden=cur!=='ent'; trend.hidden=cur!=='tr'; [].forEach.call(bar.children,function(b){ var on=b.dataset.s===cur; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)) }) }
  sync();
})();
</script>
